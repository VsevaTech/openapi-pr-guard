name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests
        run: pytest

      - name: CLI on examples — breaking spec must exit 1
        run: |
          set +e
          openapi-pr-guard --base examples/openapi-v1.yaml --head examples/openapi-v2-breaking.yaml
          code=$?
          set -e
          echo "exit code: $code"
          test "$code" -eq 1

      - name: CLI on examples — compatible spec must exit 0
        run: openapi-pr-guard --base examples/openapi-v1.yaml --head examples/openapi-v2-compatible.yaml

      - name: CLI on examples — Markdown report to step summary
        run: |
          openapi-pr-guard --base examples/openapi-v1.yaml --head examples/openapi-v2-breaking.yaml \
            --format markdown --no-fail-on-breaking >> "$GITHUB_STEP_SUMMARY"

  dogfood:
    name: Run the action on this repository
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: OpenAPI PR Guard (examples/openapi-v1.yaml)
        uses: ./
        with:
          spec: examples/openapi-v1.yaml
          comment: "true"
